[tool.poetry]
name = "scientific-semantic-search"
version = "0.1.0"
description = "Система семантического поиска и NLP-суммаризации научных публикаций"
authors = ["Anastasiia Matveeva <armatveeeva@gmailcom>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = "^0.30.6"
pydantic = "^2.9.2"
sentence-transformers = "^3.0.1"
faiss-cpu = "^1.8.0"
sumy = "^0.13.0"
numpy = "^1.26.4"
transformers = "^4.35.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
httpx = "^0.27.2"
ruff = "^0.6.9"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4"]
ignore = ["E501"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
